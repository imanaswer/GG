name: daily ops digest

# Deliberately NOT a vercel.json cron. Two Hobby-plan limits bite there: a
# sub-daily schedule makes Vercel create no deployment at all (which froze
# production once already), and the plan also caps how many cron entries a
# project may have. This project already sits at four. Rather than discover the
# ceiling through a deploy that silently never happens, ops scheduling lives
# here alongside the hourly sweep, where the cost of being wrong is a red run.

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: ${{ vars.APP_URL || 'https://www.gameground.net' }}
    steps:
      # An unset secret expands to an empty string, so the curls below send
      # "Authorization: Bearer " and every one of them comes back 401 — which is
      # indistinguishable from a wrong value, and reads as `exit 22` in the log.
      # Name the cause here instead.
      - name: Require CRON_SECRET
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in this repository's Actions secrets. Add it under Settings -> Secrets and variables -> Actions, with the SAME value as CRON_SECRET in the Vercel project. Until then every step below returns 401."
            exit 1
          fi
      # -f so a 401/500 fails loudly: a digest that silently stops arriving is
      # indistinguishable from a quiet day, which is the whole failure mode.
      - name: Send the daily ops digest
        run: |
          curl -fsSL --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/ops-digest"
